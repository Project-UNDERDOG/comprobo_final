[workspace]
authors = ["rivques <github@rivques.dev>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "comprobo_final"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = {cmd="""colcon build --symlink-install --packages-skip zed_debug \
--packages-up-to zed_display_rviz2 rviz_plugin_zed_od underdog_behaviors \
--cmake-args -DCMAKE_BUILD_TYPE=Release \
"""}
ros-clean = "rm -r build install log"
zed = "ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedm"
rviz = "ros2 launch zed_display_rviz2 display_zed_cam.launch.py camera_model:=zedm"
rqt = "ros2 run rqt_gui rqt_gui"

[activation]
scripts = ["install/setup.bash"]

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=80"
ros-jazzy-ament-cmake-auto = ">=2.5.6,<3"
compilers = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
ros-jazzy-nav2-bringup = ">=1.3.13,<2"
ros-jazzy-navigation2 = ">=1.3.13,<2"
ros-jazzy-cartographer-ros = ">=2.0.9003,<3"
ros-jazzy-cartographer = ">=2.0.0,<3"
ros-jazzy-ros-gz = ">=1.0.24,<2"
scikit-build = ">=0.19.0,<0.20"
opencv = ">=5.0.0,<6"
scikit-learn = ">=1.9.1,<2"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-diagnostic-updater = ">=4.2.7,<5"
ros-jazzy-image-transport = ">=5.1.8,<6"
ros-jazzy-point-cloud-transport = ">=4.0.9,<5"
ros-jazzy-nmea-msgs = ">=2.1.0,<3"
ros-jazzy-geographic-msgs = ">=1.0.6,<2"
ros-jazzy-zed-msgs = ">=5.3.0,<6"
ros-jazzy-zed-description = ">=0.1.5,<0.2"
